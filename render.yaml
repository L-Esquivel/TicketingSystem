# Render Blueprint for Multi-Tenant IT Ticketing System
# Web Service connected to Neon PostgreSQL Database

services:
  - type: web
    name: it-ticketing-system
    runtime: node
    plan: free # or starter
    region: oregon
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: PropDesk IT Support
      - key: NEXT_PUBLIC_APP_DESCRIPTION
        value: Multi-Tenant IT Ticketing System for Real Estate Businesses
      - key: JWT_SECRET
        generateValue: true
