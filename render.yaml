# Render Blueprint for Multi-Tenant IT Ticketing System
# Automates creation of both PostgreSQL Database and Next.js Web Service

version: "1"

databases:
  - name: ticketing-postgres-db
    databaseName: ticketing_db
    user: ticketing_user
    plan: free # or starter ($7/mo with persistence)
    region: oregon

services:
  - type: web
    name: it-ticketing-system
    runtime: node
    plan: free # or starter
    region: oregon
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing-postgres-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: PropDesk IT Support
      - key: NEXT_PUBLIC_APP_DESCRIPTION
        value: Multi-Tenant IT Ticketing System for Real Estate Businesses
      - key: JWT_SECRET
        generateValue: true
